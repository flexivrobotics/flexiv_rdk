name: Python

on:
  push:
    branches: [main, "v*.x"]
  pull_request:
    branches: [main, "v*.x"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-check-ubuntu-24:
    name: Python Check @ Ubuntu 24.04
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/shared_python_steps
        with:
          python-version: ${{ matrix.python-version }}

  python-check-ubuntu-22:
    name: Python Check @ Ubuntu 22.04
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/shared_python_steps
        with:
          python-version: ${{ matrix.python-version }}

  python-check-macos-14:
    name: Python Check @ macOS 14
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/shared_python_steps
        with:
          python-version: ${{ matrix.python-version }}

  python-check-windows-2022:
    name: Python Check @ Windows 2022
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/shared_python_steps
        with:
          python-version: ${{ matrix.python-version }}