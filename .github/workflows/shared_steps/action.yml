name: "Shared Build Steps"
runs:
  using: "composite"
  # Note: working directory will be reset to the repo root for each new step
  steps:
    # Use a fixed CMake version
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.3'

    # Build and install all dependencies to RDK installation directory.
    - name: Build and install dependencies
      shell: bash
      run: |
        cmake --version
        cd thirdparty
        bash build_and_install_dependencies.sh ~/rdk_install 4

    # Configure CMake, then build and install flexiv_rdk library to RDK installation directory.
    - name: Build and install library
      shell: bash
      run: |
        mkdir -p build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=~/rdk_install
        cmake --build . --target install --config Release

    # Guard the prebuilt library that was just downloaded: RDK ships as a self-contained shared
    # library, so anything it loads beyond the OS C/C++ runtime is a dependency left over from the
    # machine that built it. That kind of leak passes every build-time check and only shows up as a
    # loader failure on the user's machine, which is why it is asserted here rather than trusted.
    - name: Check dependencies of prebuilt library
      shell: bash
      run: |
        shopt -s nullglob
        # The <name>.<arch>-<os>.<ext> assets, not the dummy libflexiv_rdk.<ext> CMake target output.
        artifacts=(build/libflexiv_rdk.*-*.* build/flexiv_rdk.win*.dll)
        bash .github/scripts/check_artifacts.sh "${artifacts[@]}"

    # Find and link to flexiv_rdk library, then build all example programs.
    - name: Build examples
      shell: bash
      run: |
        cd example
        mkdir -p build && cd build
        cmake .. -DCMAKE_PREFIX_PATH=~/rdk_install
        cmake --build . --config Release -j 4

    # Find and link to flexiv_rdk library, then build all test programs.
    - name: Build tests
      shell: bash
      run: |
        cd test
        mkdir -p build && cd build
        cmake .. -DCMAKE_PREFIX_PATH=~/rdk_install
        cmake --build . --config Release -j 4
